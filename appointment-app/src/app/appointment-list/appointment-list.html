<div>
    <!-- Two way binding -->
    <input [(ngModel)]="newAppointmentTitle" placeholder="Enter the Title">
    <input [(ngModel)]="newAppointmentDate" type="date" placeholder="Enter the Date">
    <button (click)="addNewAppointment()">Add</button>
</div>

<ul>
    @for (appointment of appointments; track appointment.id) {
        <li>{{appointment.id}} - {{appointment.title}} - {{appointment.date | date : 'dd.MM.yyyy'}}</li> 
        <button (click)="deleteAppointment($index)">Delete</button>
    }
</ul>
