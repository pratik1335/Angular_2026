<div class="container-sm">
    <h1>Your Cart</h1>

    <mat-card>
        <mat-list>
            @for (item of cartItems(); track item.id) {
                <mat-list-item>
                        <span matListItemTitle>{{item.name}}</span>
                        <span matListItemLine>{{item.price | currency:'USD'}}</span>
                </mat-list-item>
            }
            <mat-list-item>
                    <span class="price" matListItemTitle>Total</span>
                    <span class="price" matListItemLine>{{totalPrice | currency:'USD'}}</span>
            </mat-list-item>
            <mat-list-item class="text-right">
                <button (click)="clearCart()" mat-flat-button style="background-color: #b8b5b6;color: #0f0f0f; border-radius: 4px;font-size: 18px;">Clear</button>
            </mat-list-item>
            <mat-list-item class="text-right">
                <button mat-raised-button style="background-color: #f33d7f;color: #fff; border-radius: 4px;font-size: 18px;">Checkout</button>
            </mat-list-item>
        </mat-list>
    </mat-card>
</div>
